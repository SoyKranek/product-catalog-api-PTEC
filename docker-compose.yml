services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: product_catalog
      POSTGRES_PASSWORD: product_catalog
      POSTGRES_DB: product_catalog
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_catalog -d product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ProductCatalog: Host=database;Port=5432;Database=product_catalog;Username=product_catalog;Password=product_catalog
    depends_on:
      database:
        condition: service_healthy
